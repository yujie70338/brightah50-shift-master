name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ──────────────────────────────────────────────
  # Job 1: Lint + Typecheck (matrix: functions / webapp)
  # ──────────────────────────────────────────────
  lint-typecheck:
    name: Lint & Typecheck (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # allow committing ESLint auto-fixes back to the branch
    strategy:
      fail-fast: false
      matrix:
        workspace: [functions, webapp]
    steps:
      - uses: actions/checkout@v4
        with:
          # fetch the PR branch so we can push fixes back
          ref: ${{ github.head_ref || github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ matrix.workspace }}/package-lock.json

      - name: Cache node_modules (${{ matrix.workspace }})
        uses: actions/cache@v4
        with:
          path: ${{ matrix.workspace }}/node_modules
          key: ${{ runner.os }}-node24-${{ matrix.workspace }}-${{ hashFiles(format('{0}/package-lock.json', matrix.workspace)) }}
          restore-keys: |
            ${{ runner.os }}-node24-${{ matrix.workspace }}-

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ matrix.workspace }}

      # webapp vite build requires env vars to be present (even placeholder values)
      - name: Create stub .env.local for webapp build
        if: matrix.workspace == 'webapp'
        run: |
          cat > webapp/.env.local << 'EOF'
          VITE_FIREBASE_API_KEY=ci-placeholder
          VITE_FIREBASE_AUTH_DOMAIN=ci-placeholder.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID=ci-placeholder
          VITE_FIREBASE_STORAGE_BUCKET=ci-placeholder.appspot.com
          VITE_FIREBASE_MESSAGING_SENDER_ID=000000000000
          VITE_FIREBASE_APP_ID=1:000000000000:web:0000000000000000
          EOF

      # Run eslint --fix, then commit any changes back to the PR branch.
      # Only auto-commits on PRs from the same repo (not forks, which lack write access).
      - name: ESLint auto-fix
        run: |
          if [ "${{ matrix.workspace }}" = "functions" ]; then
            npx eslint --fix --ext .js,.ts .
          else
            npx eslint --fix .
          fi
        working-directory: ${{ matrix.workspace }}

      - name: Commit ESLint fixes (PR only)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No ESLint fixes to commit."
          else
            git pull --rebase origin "${{ github.head_ref }}"
            git commit -m "style: auto-fix ESLint errors in ${{ matrix.workspace }} [skip ci]"
            git push origin HEAD:"${{ github.head_ref }}"
          fi

      - name: Lint (verify no remaining errors)
        run: npm run lint
        working-directory: ${{ matrix.workspace }}

      - name: Typecheck / Build
        run: npm run build
        working-directory: ${{ matrix.workspace }}

  # ──────────────────────────────────────────────
  # Job 2: Unit Tests (functions only, no emulator)
  # ──────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint-typecheck
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Cache node_modules (functions)
        uses: actions/cache@v4
        with:
          path: functions/node_modules
          key: ${{ runner.os }}-node24-functions-${{ hashFiles('functions/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node24-functions-

      - name: Install dependencies
        run: npm ci
        working-directory: functions

      - name: Run unit tests (JUnit report)
        run: npx vitest run test/functions.test.ts --reporter=default --reporter=junit --outputFile.junit=test-results/unit.xml
        working-directory: functions

      - name: Publish unit test results
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: functions/test-results/unit.xml
          check_name: Unit Test Results
          fail_on_failure: true

  # ──────────────────────────────────────────────
  # Job 3: Firestore Rules Tests (needs Java 21 + emulator)
  # ──────────────────────────────────────────────
  rules-tests:
    name: Firestore Rules Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint-typecheck
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Cache node_modules (functions)
        uses: actions/cache@v4
        with:
          path: functions/node_modules
          key: ${{ runner.os }}-node24-functions-${{ hashFiles('functions/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node24-functions-

      - name: Cache Firebase emulator JARs
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('functions/package.json') }}
          restore-keys: |
            firebase-emulators-

      - name: Install dependencies
        run: npm ci
        working-directory: functions

      - name: Install firebase-tools
        run: npm install -g firebase-tools@latest

      - name: Enable Firebase webframeworks experiment
        run: firebase experiments:enable webframeworks

      - name: Create test-results directory
        run: mkdir -p functions/test-results

      - name: Run Firestore rules tests (JUnit report)
        run: |
          firebase emulators:exec \
            --only firestore \
            --project brightah50-shift-master \
            "npx vitest run test/rules.test.ts --reporter=default --reporter=junit --outputFile.junit=test-results/rules.xml"
        working-directory: functions

      - name: Publish rules test results
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: functions/test-results/rules.xml
          check_name: Firestore Rules Test Results
          fail_on_failure: true

  # ──────────────────────────────────────────────
  # Job 4: Security (npm audit + secrets scan)
  # ──────────────────────────────────────────────
  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint-typecheck
    permissions:
      contents: read
      pull-requests: write # dependency-review needs this
      security-events: write # for future SARIF upload
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks needs full history

      - name: Scan for hardcoded secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Block PRs that introduce high-severity CVEs in new dependencies
      - name: Dependency review (PRs only)
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Cache node_modules (functions)
        uses: actions/cache@v4
        with:
          path: functions/node_modules
          key: ${{ runner.os }}-node24-functions-${{ hashFiles('functions/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node24-functions-

      - name: Cache node_modules (webapp)
        uses: actions/cache@v4
        with:
          path: webapp/node_modules
          key: ${{ runner.os }}-node24-webapp-${{ hashFiles('webapp/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node24-webapp-

      - name: Audit functions dependencies
        run: npm ci && npm audit --audit-level=high
        working-directory: functions

      - name: Audit webapp dependencies
        run: npm ci && npm audit --audit-level=high
        working-directory: webapp
